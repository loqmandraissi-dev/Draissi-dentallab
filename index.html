<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draissi Dental Lab — Laboratoire de prothèse dentaire, Marrakech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F3A;
    --navy-deep:#071527;
    --navy-soft:#152C4D;
    --gold:#B08D57;
    --gold-light:#D9BC8C;
    --paper:#F6F5F2;
    --white:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#E2E1DB;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    letter-spacing:-0.01em;
    color:var(--navy);
  }
  a{color:inherit; text-decoration:none;}
  img,video{max-width:100%; display:block;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  /* ---------- Header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:40;
    background:rgba(7,21,39,0.0);
    transition:background .35s ease, box-shadow .35s ease;
  }
  header.solid{
    background:var(--navy-deep);
    box-shadow:0 1px 0 rgba(255,255,255,0.06);
  }
  header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:76px;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-size:1.28rem;
    color:var(--white);
    letter-spacing:0.01em;
    display:flex;
    align-items:center;
  }
  .brand img{
    height:46px;
    width:auto;
    border-radius:3px;
  }
  .brand span{color:var(--gold-light);}
  nav{display:flex; align-items:center; gap:34px;}
  nav a.nav-link{
    color:rgba(255,255,255,0.82);
    font-size:0.92rem;
    font-weight:500;
    transition:color .2s ease;
  }
  nav a.nav-link:hover{color:var(--white);}
  .btn{
    display:inline-flex; align-items:center; gap:9px;
    padding:12px 24px;
    font-size:0.92rem; font-weight:600;
    border-radius:var(--radius);
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .18s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--gold); color:var(--navy-deep);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline-light{border-color:rgba(255,255,255,0.5); color:var(--white); background:transparent;}
  .btn-outline-light:hover{border-color:var(--white); background:rgba(255,255,255,0.08);}
  .btn-navy{background:var(--navy); color:var(--white);}
  .btn-navy:hover{background:var(--navy-soft);}
  .menu-toggle{display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px;}
  .menu-toggle span{width:22px; height:2px; background:var(--white);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex; align-items:flex-end;
    overflow:hidden;
    background:var(--navy-deep);
  }
  .hero video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.55;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(7,21,39,0.55) 0%, rgba(7,21,39,0.35) 38%, rgba(7,21,39,0.92) 100%);
  }
  .hero-content{
    position:relative; z-index:2;
    padding-bottom:96px;
    padding-top:180px;
    max-width:680px;
  }
  .hero-eyebrow{
    color:var(--gold-light);
    font-size:0.86rem;
    font-weight:600;
    margin-bottom:18px;
  }
  .hero h1{
    color:var(--white);
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    line-height:1.12;
    margin-bottom:22px;
  }
  .hero h1 em{
    font-style:italic;
    color:var(--gold-light);
  }
  .hero p.lead{
    color:rgba(255,255,255,0.86);
    font-size:1.08rem;
    max-width:520px;
    margin-bottom:34px;
  }
  .hero-actions{display:flex; flex-wrap:wrap; gap:16px;}

  /* ---------- Section shell ---------- */
  section{padding:104px 0;}
  @media (max-width:768px){ section{padding:72px 0;} }
  .section-head{max-width:620px; margin-bottom:56px;}
  .section-head h2{font-size:clamp(1.7rem,3vw,2.35rem); margin-bottom:16px;}
  .section-head p{color:var(--ink-soft); font-size:1.03rem;}
  .kicker{
    color:var(--gold);
    font-weight:700;
    font-size:0.82rem;
    letter-spacing:0.04em;
    margin-bottom:14px;
    display:block;
  }

  /* ---------- Intro / About ---------- */
  .about{background:var(--white);}
  .about-grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:64px;
    align-items:center;
  }
  @media (max-width:860px){ .about-grid{grid-template-columns:1fr;} }
  .about-copy p{color:var(--ink-soft); margin-bottom:18px; font-size:1.02rem;}
  .about-copy p:last-child{margin-bottom:0;}
  .stat-row{
    display:flex; gap:40px;
    margin-top:36px;
    padding-top:32px;
    border-top:1px solid var(--line);
  }
  .stat-row div strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.7rem;
    color:var(--navy);
  }
  .stat-row div span{
    color:var(--ink-soft);
    font-size:0.88rem;
  }
  .about-frame{
    position:relative;
    border:1px solid var(--line);
    padding:14px;
    background:var(--paper);
  }
  .about-frame img{width:100%; height:auto; display:block;}
  .about-frame .tag{
    position:absolute; bottom:-16px; left:28px;
    background:var(--navy);
    color:var(--white);
    padding:9px 18px;
    font-size:0.82rem;
    letter-spacing:0.02em;
  }

  /* ---------- Services ---------- */
  .services{background:var(--paper);}
  .service-list{
    border-top:1px solid var(--line);
  }
  .service-row{
    display:grid;
    grid-template-columns:44px 1fr auto;
    align-items:center;
    gap:24px;
    padding:26px 0;
    border-bottom:1px solid var(--line);
    transition:background .2s ease;
  }
  .service-row:hover{background:rgba(176,141,87,0.06);}
  .service-num{
    font-family:'Fraunces',serif;
    color:var(--gold);
    font-size:1rem;
  }
  .service-row h3{
    font-size:1.14rem;
    font-weight:500;
    color:var(--navy);
  }
  .service-row p{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin-top:4px;
  }
  .service-arrow{
    color:var(--ink-soft);
    font-size:0.86rem;
    white-space:nowrap;
  }
  @media (max-width:640px){
    .service-row{grid-template-columns:32px 1fr;}
    .service-arrow{display:none;}
  }

  /* ---------- Gallery ---------- */
  .gallery{background:var(--white);}
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  @media (max-width:768px){ .gallery-grid{grid-template-columns:1fr; max-width:420px; margin:0 auto;} }
  .gallery-item{
    border:1px solid var(--line);
    background:var(--paper);
    overflow:hidden;
  }
  .gallery-item img{
    width:100%;
    height:340px;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .gallery-item:hover img{transform:scale(1.04);}
  .gallery-cap{
    padding:16px 18px;
    border-top:1px solid var(--line);
  }
  .gallery-cap h4{
    font-family:'Fraunces',serif;
    font-size:1rem;
    color:var(--navy);
    font-weight:500;
  }

  /* ---------- Tariff tables ---------- */
  .tariff-groups{display:flex; flex-direction:column; gap:44px;}
  .tariff-group h3{
    font-size:1.02rem;
    font-weight:700;
    color:var(--navy);
    font-family:'Manrope',sans-serif;
    padding-bottom:12px;
    border-bottom:2px solid var(--gold);
    margin-bottom:4px;
  }
  .tariff-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    padding:15px 0;
    border-bottom:1px solid var(--line);
  }
  .tariff-row .label{color:var(--ink); font-size:0.98rem;}
  .tariff-row .label small{display:block; color:var(--ink-soft); font-size:0.8rem; margin-top:2px;}
  .tariff-row .price{
    font-family:'Fraunces',serif;
    color:var(--navy);
    font-size:1.05rem;
    white-space:nowrap;
  }
  .tariff-row .price.devis{
    font-family:'Manrope',sans-serif;
    color:var(--ink-soft);
    font-size:0.88rem;
    font-weight:600;
  }
  .tariff-note{
    margin-top:12px;
    color:var(--ink-soft);
    font-size:0.85rem;
  }

  /* ---------- Process ---------- */
  .process{background:var(--navy);}
  .process .section-head h2, .process .kicker{color:var(--white);}
  .process .section-head h2{color:var(--white);}
  .process .section-head p{color:rgba(255,255,255,0.72);}
  .process-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.14);
  }
  @media (max-width:860px){ .process-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .process-grid{grid-template-columns:1fr;} }
  .process-step{
    background:var(--navy);
    padding:34px 28px;
  }
  .process-step .step-index{
    font-family:'Fraunces',serif;
    color:var(--gold-light);
    font-size:1.6rem;
    margin-bottom:14px;
  }
  .process-step h3{
    color:var(--white);
    font-size:1.05rem;
    font-weight:500;
    margin-bottom:8px;
  }
  .process-step p{
    color:rgba(255,255,255,0.68);
    font-size:0.9rem;
  }
  .process-note{
    margin-top:28px;
    color:rgba(255,255,255,0.6);
    font-size:0.88rem;
  }

  /* ---------- Contact ---------- */
  .contact{background:var(--white);}
  .contact-grid{
    display:grid;
    grid-template-columns:0.9fr 1.1fr;
    gap:64px;
  }
  @media (max-width:900px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-info-item{
    display:flex; gap:16px;
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .contact-info-item:first-child{padding-top:0;}
  .contact-info-item .ico{
    width:38px; height:38px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-size:1rem;
  }
  .contact-info-item h4{
    font-size:0.95rem;
    color:var(--navy);
    margin-bottom:3px;
  }
  .contact-info-item p{color:var(--ink-soft); font-size:0.92rem;}
  .contact-info-item a{color:var(--ink-soft);}
  .contact-info-item a:hover{color:var(--navy);}

  form{
    background:var(--paper);
    border:1px solid var(--line);
    padding:40px;
  }
  @media (max-width:480px){ form{padding:26px;} }
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    color:var(--navy);
    margin-bottom:8px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--line);
    background:var(--white);
    font-family:'Manrope',sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    border-radius:var(--radius);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
    border-color:var(--gold);
  }
  .field textarea{resize:vertical; min-height:96px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:480px){ .field-row{grid-template-columns:1fr;} }
  .form-submit{width:100%; justify-content:center; font-size:0.98rem; padding:15px;}
  .form-hint{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:14px;
    text-align:center;
  }

  /* ---------- Footer ---------- */
  footer{background:var(--navy-deep); padding:56px 0 28px;}
  .footer-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap:wrap; gap:32px;
    padding-bottom:32px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .footer-brand{color:var(--white); font-family:'Fraunces',serif; font-size:1.2rem;}
  .footer-brand span{color:var(--gold-light);}
  .footer-loc{color:rgba(255,255,255,0.6); font-size:0.88rem; margin-top:8px; max-width:280px;}
  .footer-links{display:flex; gap:36px; flex-wrap:wrap;}
  .footer-links div h5{color:var(--white); font-size:0.85rem; margin-bottom:12px;}
  .footer-links div a, .footer-links div p{
    display:block; color:rgba(255,255,255,0.62); font-size:0.88rem; margin-bottom:8px;
  }
  .footer-links div a:hover{color:var(--gold-light);}
  .footer-bottom{
    padding-top:24px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
    color:rgba(255,255,255,0.42);
    font-size:0.8rem;
  }

  /* ---------- Utility / focus ---------- */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important; animation:none !important;}
  }

  /* mobile nav */
  @media (max-width:860px){
    nav{
      position:fixed; top:76px; right:0; left:0;
      background:var(--navy-deep);
      flex-direction:column; align-items:flex-start;
      gap:0;
      padding:8px 28px 20px;
      transform:translateY(-8px);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
    }
    nav.open{opacity:1; transform:translateY(0); pointer-events:auto;}
    nav a.nav-link{padding:14px 0; width:100%; border-bottom:1px solid rgba(255,255,255,0.08);}
    nav .btn{margin-top:14px;}
    .menu-toggle{display:flex;}
  }
</style>
</head>
